[workspace]
members = ["crates/game-core", "crates/runner", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
game-core = { path = "crates/game-core" }
runner = { path = "crates/runner" }
